<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#673AB7"
  >

  <title>
    CifrasKadosh - Offline
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 24px;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background-color:
        #f3e5f5;

      color:
        #33252f;

      text-align:
        center;

    }


    .container {

      width: 100%;

      max-width: 420px;

      padding: 40px 28px;

      background:
        #ffffff;

      border-radius:
        16px;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.08);

    }


    .icon {

      width:
        72px;

      height:
        72px;

      margin:
        0 auto 20px;

    }


    h1 {

      margin:
        0 0 12px;

      font-size:
        26px;

    }


    p {

      margin:
        0;

      font-size:
        17px;

      line-height:
        1.5;

      color:
        #665b63;

    }


    button {

      margin-top:
        28px;

      min-height:
        46px;

      padding:
        10px 24px;

      border:
        0;

      border-radius:
        8px;

      background:
        #673ab7;

      color:
        #ffffff;

      font-size:
        16px;

      font-weight:
        600;

      cursor:
        pointer;

    }

  </style>

</head>


<body>

  <main class="container">

    <img
      class="icon"
      src="/icon-192x192.png"
      alt="CifrasKadosh"
    >


    <h1>
      CifrasKadosh
    </h1>


    <p>

      Você está offline e esta tela
      ainda não foi armazenada no aparelho.

      As cifras e telas utilizadas anteriormente
      continuam disponíveis offline.

    </p>


    <button
      type="button"
      onclick="window.location.reload()"
    >

      Tentar novamente

    </button>

  </main>

</body>

</html>
